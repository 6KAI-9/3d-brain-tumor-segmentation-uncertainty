name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: |
          PYTHON_FILES="$(git ls-files '*.py' '*.pyi')"
          if [ -n "$PYTHON_FILES" ]; then
            mypy $PYTHON_FILES
          else
            echo "No Python files found; skipping mypy."
          fi
      - name: Dead code check (vulture)
        run: |
          PYTHON_FILES="$(git ls-files '*.py' '*.pyi')"
          if [ -n "$PYTHON_FILES" ]; then
            vulture $PYTHON_FILES
          else
            echo "No Python files found; skipping vulture."
          fi
      - name: Tests
        run: pytest -q || [ $? -eq 5 ]
