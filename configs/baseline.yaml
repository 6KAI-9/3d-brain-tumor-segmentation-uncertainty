seed: 42

data:
  root_dir: data/msd
  download: true
  splits_path: configs/data_splits/task01_brain_tumour.json
  split_ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  patch_size: [96, 96, 96]
  num_samples: 2
  pos: 1
  neg: 1
  num_workers: 4

model:
  in_channels: 4
  out_channels: 1
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  dropout: 0.0

training:
  epochs: 100
  batch_size: 1
  accum_steps: 4
  lr: 1.0e-4
  amp: true
  val_interval: 5
  checkpoint_dir: checkpoints/baseline

mlflow:
  tracking_uri: mlruns
  experiment_name: brain-tumour-baseline
  run_name: attention-unet-baseline
